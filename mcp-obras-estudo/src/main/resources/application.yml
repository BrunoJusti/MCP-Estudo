spring:
  application:
    name: mcp-obras-estudo

  datasource:
    url: jdbc:h2:mem:obras;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true

  ai:
    mcp:
      server:
        name: mcp-obras-estudo
        version: 0.0.1
        protocol: STREAMABLE

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080

logging:
  level:
    org.springframework.security.web.FilterChainProxy: DEBUG

server:
  port: 8080