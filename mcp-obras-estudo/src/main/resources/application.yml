spring:
  application:
    name: mcp-obras-estudo

  datasource:
    url: jdbc:h2:mem:obras;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true

  ai:
    mcp:
      server:
        name: mcp-obras-estudo
        version: 0.0.1
        # Streamable HTTP é o transporte padrão/atual (SSE está deprecado).
        # O servidor fica escutando em /mcp na porta abaixo.
        protocol: STREAMABLE

server:
  port: 8080
